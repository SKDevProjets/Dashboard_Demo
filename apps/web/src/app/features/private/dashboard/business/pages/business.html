<section class="finance">
  <header class="finance-header">
    <div>
      <h2>Financial Overview</h2>
      <p>Invoice performance and payment status</p>
    </div>

    <span class="live-badge">
      <span class="live-dot"></span>
      Live data
    </span>
  </header>

  @if (loading) {
    <p class="state-message">Loading financial data...</p>
  } @else if (error) {
    <p class="state-message error" role="alert">
      Unable to load invoice statistics.
    </p>
  } @else {
    <app-stats-grid [stats]="stats" />
    <app-invoice-charts [stats]="stats" />
    <app-payment-progress [stats]="stats" />
  }
</section>
